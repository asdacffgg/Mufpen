<svg
    xmlns="http://www.w3.org/2000/svg"
    width="512"
    height="512"
    viewBox="0 0 512 512">

    <defs>
        <!-- Soft card drop shadow, same stacking as a native app icon. -->
        <filter id="cardShadow"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%">
            <feDropShadow
                dx="0"
                dy="3"
                stdDeviation="6"
                flood-color="#000000"
                flood-opacity="0.10"/>

            <feDropShadow
                dx="0"
                dy="14"
                stdDeviation="20"
                flood-color="#000000"
                flood-opacity="0.12"/>
        </filter>

        <filter id="letterShadow"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%">
            <feDropShadow
                dx="0"
                dy="2"
                stdDeviation="3"
                flood-color="#0b1030"
                flood-opacity="0.18"/>
        </filter>

        <!-- Indigo to violet: distinct from Mufpen's neutral card, still calm. -->
        <linearGradient id="cardFill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2b6cf6"/>
            <stop offset="0.55" stop-color="#4a55ee"/>
            <stop offset="1" stop-color="#6c4cf1"/>
        </linearGradient>

        <linearGradient id="inkStroke" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ffc861"/>
            <stop offset="1" stop-color="#ff9d3d"/>
        </linearGradient>
    </defs>

    <!-- Card -->
    <rect
        x="46"
        y="46"
        width="420"
        height="420"
        rx="96"
        fill="url(#cardFill)"
        filter="url(#cardShadow)"/>

    <!-- Inner highlight keeps the card from reading as a flat block. -->
    <rect
        x="50"
        y="50"
        width="412"
        height="412"
        rx="92"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.16"
        stroke-width="3"/>

    <!-- Monogram: geometric M, 44px stems, centered on the card. -->
    <path
        fill="#ffffff"
        filter="url(#letterShadow)"
        d="
            M150 362
            V170
            L256 300
            L362 170
            V362
            H318
            V250
            L256 332
            L194 250
            V362
            Z
        "/>

    <!-- Pen stroke: the "pen" half of Mufpen, slightly off-level like a hand-drawn rule. -->
    <rect
        x="168"
        y="396"
        width="176"
        height="22"
        rx="11"
        fill="url(#inkStroke)"
        transform="rotate(-4 256 407)"/>

</svg>
